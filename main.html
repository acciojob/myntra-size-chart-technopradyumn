<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Chart</title>
  <style>
    body {
      font-family: Calibri, Arial, sans-serif;
      padding: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 620px;
      font-size: 15px;
    }
    th, td {
      border: 1px solid #000;
      padding: 3px 4px;
      height: 20px;
    }
    thead th {
      background: #c0504d;
      color: #fff;
      font-weight: normal;
      text-align: left;
    }
    tbody td {
      text-align: right;
    }
    tbody td:first-child {
      text-align: left;
    }
    tbody tr:nth-child(1) td {
      background: #da9694;
      color: #fff;
    }
    tbody tr:nth-child(2) td {
      background: #f2dcdb;
      color: #000;
    }
    tbody tr:nth-child(3) td {
      background: #d9d9d9;
      color: #000;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Part</th>
        <th>XS</th>
        <th>S</th>
        <th>M</th>
        <th>L</th>
        <th>XL</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Waist</td>
        <td>25</td>
        <td>28</td>
        <td>30</td>
        <td>31</td>
        <td>32</td>
      </tr>
      <tr>
        <td>Chest</td>
        <td>34</td>
        <td>34</td>
        <td>38</td>
        <td>40</td>
        <td>41</td>
      </tr>
      <tr>
        <td>Sleeve</td>
        <td>23</td>
        <td>24</td>
        <td>24</td>
        <td>25</td>
        <td>25</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
