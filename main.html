<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Chart</title>
  <style>
    body {
      font-family: Calibri, Arial, sans-serif;
      padding: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 650px;
      font-size: 15px;
      table-layout: fixed;
    }
    th, td {
      padding: 3px 4px;
      height: 20px;
    }

    /* empty surrounding cells: light grey gridline */
    .gap {
      background: #fff;
      border: 1px solid #d4d4d4;
      padding: 0;
    }
    /* remove a side's border (outer edge, or the edge touching the chart) */
    .t { border-top: none; }
    .b { border-bottom: none; }
    .l { border-left: none; }
    .r { border-right: none; }

    .gap-left  { width: 38px; }
    .gap-right { width: 60px; }

    /* the actual size chart cells */
    .cell {
      border: 1px solid #000;
    }
    thead .cell {
      background: #c0504d;
      color: #fff;
      font-weight: normal;
      text-align: left;
    }
    tbody .cell {
      text-align: right;
    }
    tbody .cell:nth-child(2) {
      text-align: left;
    }
    .waist .cell  { background: #da9694; color: #fff; }
    .chest .cell  { background: #f2dcdb; color: #000; }
    .sleeve .cell { background: #d9d9d9; color: #000; }
  </style>
</head>
<body>

  <table>
    <thead>
      <!-- blank top row -->
      <tr>
        <th class="gap gap-left t l"></th>
        <th class="gap t b"></th>
        <th class="gap t b"></th>
        <th class="gap t b"></th>
        <th class="gap t b"></th>
        <th class="gap t b"></th>
        <th class="gap t b"></th>
        <th class="gap gap-right t r"></th>
      </tr>
      <tr>
        <th class="gap l r"></th>
        <th class="cell">Part</th>
        <th class="cell">XS</th>
        <th class="cell">S</th>
        <th class="cell">M</th>
        <th class="cell">L</th>
        <th class="cell">XL</th>
        <th class="gap l r"></th>
      </tr>
    </thead>
    <tbody>
      <tr class="waist">
        <td class="gap l r"></td>
        <td class="cell">Waist</td>
        <td class="cell">25</td>
        <td class="cell">28</td>
        <td class="cell">30</td>
        <td class="cell">31</td>
        <td class="cell">32</td>
        <td class="gap l r"></td>
      </tr>
      <tr class="chest">
        <td class="gap l r"></td>
        <td class="cell">Chest</td>
        <td class="cell">34</td>
        <td class="cell">34</td>
        <td class="cell">38</td>
        <td class="cell">40</td>
        <td class="cell">41</td>
        <td class="gap l r"></td>
      </tr>
      <tr class="sleeve">
        <td class="gap l r"></td>
        <td class="cell">Sleeve</td>
        <td class="cell">23</td>
        <td class="cell">24</td>
        <td class="cell">24</td>
        <td class="cell">25</td>
        <td class="cell">25</td>
        <td class="gap l r"></td>
      </tr>
      <!-- blank bottom row -->
      <tr>
        <td class="gap b l"></td>
        <td class="gap t b"></td>
        <td class="gap t b"></td>
        <td class="gap t b"></td>
        <td class="gap t b"></td>
        <td class="gap t b"></td>
        <td class="gap t b"></td>
        <td class="gap b r"></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
